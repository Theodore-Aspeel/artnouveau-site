# Project-level Codex configuration, intentionally versioned for this repository.
# ANAD 2.0 defaults routine implementation work to Terra to preserve Plus allowance.
# Escalate individual difficult tasks to Sol or Astra from Work/Codex when justified.

model = "gpt-5.6-terra"
model_provider = "openai"

approval_policy = "on-request"
sandbox_mode = "workspace-write"

model_reasoning_effort = "medium"
plan_mode_reasoning_effort = "high"
model_verbosity = "medium"

web_search = "cached"

[sandbox_workspace_write]
writable_roots = []
network_access = false

[history]
persistence = "save-all"
