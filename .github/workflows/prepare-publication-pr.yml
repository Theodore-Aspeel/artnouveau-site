name: Prepare article publication PR

on:
  workflow_dispatch:
    inputs:
      slug:
        description: Article slug to publish
        required: true
        type: string
      publication_date:
        description: Real publication date (YYYY-MM-DD)
        required: true
        type: string
      mode:
        description: Dry run first; create-pr writes only to a review branch
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - create-pr
      confirmation:
        description: Type PUBLISH only after reviewing the FR, EN and NL previews
        required: false
        type: string

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: publication-${{ inputs.slug }}
  cancel-in-progress: false

jobs:
  prepare-publication:
    runs-on: ubuntu-latest
    env:
      ARTICLE_SLUG: ${{ inputs.slug }}
      PUBLICATION_DATE: ${{ inputs.publication_date }}
      PUBLICATION_MODE_REQUEST: ${{ inputs.mode }}
      PUBLICATION_CONFIRMATION: ${{ inputs.confirmation }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate requested operation
        shell: bash
        run: |
          if [[ ! "$ARTICLE_SLUG" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "Invalid article slug." >&2
            exit 1
          fi
          if [[ ! "$PUBLICATION_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Publication date must use YYYY-MM-DD." >&2
            exit 1
          fi
          if [[ "$PUBLICATION_MODE_REQUEST" == "create-pr" && "$PUBLICATION_CONFIRMATION" != "PUBLISH" ]]; then
            echo "create-pr requires the exact PUBLISH confirmation after human preview review." >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run read-only publication preflight
        run: >-
          python -m tools.editorial_manager publish-article
          "$ARTICLE_SLUG"
          --date "$PUBLICATION_DATE"
          --json

      - name: Stop after safe dry run
        if: inputs.mode == 'dry-run'
        run: echo "Dry run passed. No file, branch or pull request was created."

      - name: Apply approved publication transition
        if: inputs.mode == 'create-pr'
        run: >-
          python -m tools.editorial_manager publish-article
          "$ARTICLE_SLUG"
          --date "$PUBLICATION_DATE"
          --write
          --approve
          --json

      - name: Verify publication change scope
        if: inputs.mode == 'create-pr'
        shell: bash
        run: |
          if git diff --quiet -- src/data/articles.json; then
            echo "The approved transition did not change articles.json." >&2
            exit 1
          fi
          unexpected="$(git status --porcelain --untracked-files=all | awk '$2 != "src/data/articles.json" {print}')"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected files changed during publication:" >&2
            echo "$unexpected" >&2
            exit 1
          fi

      - name: Commit and push review branch
        if: inputs.mode == 'create-pr'
        shell: bash
        run: |
          branch_name="publication/${ARTICLE_SLUG}-${PUBLICATION_DATE}-${GITHUB_RUN_ID}"
          git switch -c "$branch_name"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/articles.json
          git commit -m "content: publish ${ARTICLE_SLUG}"
          git push origin "$branch_name"
          echo "PUBLICATION_BRANCH=$branch_name" >> "$GITHUB_ENV"

      - name: Run all branch quality profiles
        if: inputs.mode == 'create-pr'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run quality.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$PUBLICATION_BRANCH"

          quality_run_id=""
          for attempt in {1..20}; do
            quality_run_id="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow quality.yml \
              --branch "$PUBLICATION_BRANCH" \
              --event workflow_dispatch \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId')"
            if [[ -n "$quality_run_id" ]]; then
              break
            fi
            sleep 2
          done
          if [[ -z "$quality_run_id" ]]; then
            echo "The branch quality workflow could not be found." >&2
            exit 1
          fi
          gh run watch "$quality_run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --exit-status

      - name: Open publication pull request
        if: inputs.mode == 'create-pr'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          body_file="$RUNNER_TEMP/publication-pr-body.md"
          printf '%s\n' \
            "## Publication request" \
            "" \
            "- Article: \`$ARTICLE_SLUG\`" \
            "- Publication date: \`$PUBLICATION_DATE\`" \
            "- Human preview confirmation: received" \
            "- Automated preflight and all three branch quality profiles: passed" \
            "" \
            "This pull request does not merge or deploy itself. Normal PR checks and final review still apply." \
            > "$body_file"
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$PUBLICATION_BRANCH" \
            --title "Publish: $ARTICLE_SLUG" \
            --body-file "$body_file"
